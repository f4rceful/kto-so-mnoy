name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prometheus alert rules
        run: docker run --rm --entrypoint promtool -v "$PWD/monitoring:/m:ro" prom/prometheus:v3.7.0 check rules /m/alerts.yml

      - name: Alertmanager config
        run: docker run --rm --entrypoint amtool -v "$PWD/monitoring:/m:ro" prom/alertmanager:v0.34.2 check-config /m/alertmanager.yml

      - name: Compose files with every profile
        run: docker compose --profile monitoring --profile alerts --profile logs config --quiet
        env:
          POSTGRES_PASSWORD: ci

      - name: Dashboards are valid
        run: |
          python3 - <<'PY'
          import glob, json
          for path in glob.glob("monitoring/grafana/dashboards/*.json"):
              dash = json.load(open(path, encoding="utf-8"))
              ids = [p["id"] for p in dash["panels"]]
              assert len(ids) == len(set(ids)), f"duplicate panel ids in {path}"
              assert dash["uid"] and dash["title"], path
              print(path, len(ids), "panels")
          PY
